<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="Salesforce Platform Administrator 試験対策アプリ" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Salesforce Admin Drill</title>
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Platform Administrator</p>
        <h1>Salesforce Admin Drill</h1>
      </div>
      <button class="icon-button hidden" id="install-button" type="button" aria-label="アプリをインストール">
        <span aria-hidden="true">↓</span>
      </button>
    </header>

    <main id="app" class="app-shell" aria-live="polite">
      <section class="loading card">
        <div class="spinner" aria-hidden="true"></div>
        <p>問題集を読み込んでいます...</p>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <button class="nav-item active" data-view="home" type="button">
        <span class="nav-icon" aria-hidden="true">⌂</span>
        <span>ホーム</span>
      </button>
      <button class="nav-item" data-view="history" type="button">
        <span class="nav-icon" aria-hidden="true">✓</span>
        <span>学習記録</span>
      </button>
      <button class="nav-item" data-view="settings" type="button">
        <span class="nav-icon" aria-hidden="true">⚙</span>
        <span>設定</span>
      </button>
    </nav>

    <script src="./app.js" defer></script>
  </body>
</html>
